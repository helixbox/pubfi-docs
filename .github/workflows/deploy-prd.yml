name: Deploy production
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA accepted in Staging
        required: true
        type: string
      staging_run_id:
        description: Successful Deploy staging push run for that SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy-docs.yml
    with:
      target: production
      source_sha: ${{ inputs.source_sha }}
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
