name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy-docs.yml
    with:
      target: staging
      source_sha: ${{ github.sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
